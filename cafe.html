<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"> <!-- 検収後の移管時にこの行を削除 -->
<title>東京のタイカフェを探す｜THAI SPOT TOKYO</title>
<meta name="description" content="東京にあるタイカフェを一覧から探せます。エリアやメニューなど、追加条件での絞り込みにも対応しています。">
<link rel="stylesheet" href="assets/css/style.css?v=20260825c">
<style>
  /* search.htmlと同一の局所スタイル(共有cssファイルは設計書1章のファイル構成に無いためページごとに複製。
     style.cssは編集しない・実装設計書10-3章の check.html 局所style慣例に準拠)。 */
  .page-catch { font-family: var(--font-heading); font-weight: 700; font-size: 14px; color: var(--color-primary-deep); margin: 2px 0 6px; }
  .page-lead { color: var(--color-muted-2); font-size: 13.5px; margin: 4px 0 var(--space-5); }
  .filter-group { margin-bottom: var(--space-4); }
  .filter-group:last-of-type { margin-bottom: 0; }
  .dish-subgroup { margin-bottom: var(--space-2); }
  .dish-subgroup__title { font-size: 11.5px; color: var(--color-muted); margin: var(--space-2) 0 6px; }
  .dish-subgroup:first-child .dish-subgroup__title { margin-top: 0; }
  .search-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-5); }
  .search-actions .btn { flex: 1 1 auto; }
  .results-sub { font-size: 13px; color: var(--color-muted-2); margin: 0 0 var(--space-3); }
  .dropped-note {
    font-size: 12px; color: var(--color-tag-gold-ink); background: var(--color-tag-gold-bg);
    border-radius: var(--radius-s); padding: 8px 12px; margin-bottom: var(--space-3);
  }
</style>
</head>
<body>

<div id="site-header"></div>

<main id="main-content">
  <div class="container">

    <!-- シート設定に問題がある可能性があるときだけ表示(実装設計書13-I-10)。TS.render.warningsBannerは
         担当Hが並行実装中のため、呼び出し側は typeof ガード付きで独立動作させる(未実装でも本ページは壊れない)。 -->
    <div id="warnings-banner-mount"></div>

    <!-- ページタイトル/キャッチ/リード文はSite_Texts駆動(cafe_heading/cafe_catch/cafe_lead)。
         HTML初期値はtexts-default.jsの現行値(=仕様書3-5の文言)と同一にして、JS未実行/データ取得前でも
         矛盾なく表示する。 -->
    <section id="cafe-intro-section" aria-labelledby="cafe-title">
      <h1 id="cafe-title" class="section-title">東京のタイカフェを探す</h1>
      <p id="cafe-catch" class="page-catch">東京で、ちょっとタイ気分。</p>
      <p id="cafe-lead" class="page-lead">東京にあるタイカフェを集めました。タイティーやタイスイーツなど、気になるメニューから探すこともできます。</p>
    </section>

    <!-- Store_type=Cafe固定絞込+追加条件(料理/エリア/駅/シーン/特徴)で再検索可(要件1章5番)。
         店舗タイプ選択チップは出さない(常にCafeを強制し、UIからも外せないようにする)。 -->
    <section id="cafe-form-section" aria-labelledby="cafe-form-title">
      <form id="cafe-form" class="panel">
        <h2 id="cafe-form-title" class="visually-hidden">追加条件で絞り込む</h2>

        <div class="filter-group" data-cat-group="dish">
          <h2 id="cat-title-dish">食べたいもの</h2>
          <div id="dish-groups"></div>
        </div>

        <div class="filter-group" data-cat-group="area">
          <h2 id="cat-title-area">エリア</h2>
          <div id="chips-area"></div>
        </div>

        <div class="filter-group" data-cat-group="station">
          <h2 id="cat-title-station">最寄駅</h2>
          <div id="chips-station"></div>
        </div>

        <div class="filter-group" data-cat-group="scene">
          <h2 id="cat-title-scene">利用シーン</h2>
          <div id="chips-scene"></div>
        </div>

        <div class="filter-group" data-cat-group="feature">
          <h2 id="cat-title-feature">こだわり</h2>
          <div id="chips-feature"></div>
        </div>

        <div class="search-actions">
          <button type="submit" class="btn btn--primary" id="cafe-submit-btn">この条件で探す</button>
          <button type="button" class="btn btn--outline" id="cafe-clear-btn">条件をクリア</button>
        </div>
      </form>
    </section>

    <section id="cafe-results-section" aria-labelledby="cafe-results-heading" aria-live="polite">
      <p class="results-sub" id="cafe-results-heading"></p>
      <p class="dropped-note" id="cafe-dropped-note" hidden></p>
      <div class="card-list" id="cafe-results-list"></div>
      <div class="state-panel" id="cafe-results-empty" hidden>
        <p class="state-panel__desc" id="cafe-results-empty-text"></p>
        <div class="state-panel__actions">
          <button type="button" class="btn btn--outline" id="cafe-results-change-btn">条件を変更する</button>
        </div>
      </div>
    </section>

    <!-- 広告枠なし(要件1章表・タイカフェ行=広告枠列は空欄。Adsシートの位置定義にもcafe_bottomは無い) -->

    <!-- データ取得失敗時のみ表示(要件2-3: 白画面禁止) -->
    <div id="cafe-error" hidden></div>

  </div>
</main>

<div id="site-footer"></div>

<script src="assets/js/config.js?v=20260825c"></script>
<script src="assets/js/texts-default.js?v=20260825c"></script>
<script src="assets/js/util.js?v=20260825c"></script>
<script src="assets/js/data.js?v=20260825c"></script>
<script src="assets/js/render.js?v=20260825c"></script>
<script src="assets/js/search.js?v=20260825c"></script>
<script src="assets/js/log.js?v=20260825c"></script>
<script>
(function () {
  'use strict';

  // db.texts()が万一空文字を返した場合の保険(通常は texts-default.js の初回リリース原稿がそのまま使われる)。
  var ZERO_FALLBACK = '条件に合うお店が見つかりませんでした。条件を減らして、もう一度探してみてください。';
  var DROPPED_SUFFIX_FALLBACK = 'の条件が見つからなかったため、全店舗を表示しています。';
  // 0件時は「全店舗を表示しています」と言うと矛盾するため出し分ける(実装設計書13-I-2)
  var DROPPED_SUFFIX_ZERO_FALLBACK = 'の条件は見つかりませんでした。';

  // 実装設計書13-I-6: 見出しは db.texts('menu_category_'+category.toLowerCase()) を先に引き、
  // 空ならこのハードコード表→さらに無ければキーそのもの(またはその他)の順で解決する
  // (menu_category_*キーは担当Hが並行追加中のため、texts側が空の間はこの表が独立して機能する)。
  var MENU_CATEGORY_ORDER = ['RICE', 'CURRY', 'NOODLE', 'SALAD', 'SOUP', 'GRILL', 'FRIED', 'STIR_FRY', 'HOT_POT', 'DESSERT', 'DRINK'];
  var MENU_CATEGORY_LABELS = {
    RICE: 'ご飯もの', CURRY: 'カレー', NOODLE: '麺類', SALAD: 'サラダ', SOUP: 'スープ',
    GRILL: '焼き物', FRIED: '揚げ物', STIR_FRY: '炒め物', HOT_POT: '鍋物', DESSERT: 'デザート', DRINK: 'ドリンク'
  };

  // menu_category_*テキストキーの解決順(実装設計書13-I-6): texts() → ハードコード表 → fallback(キー自体/その他)
  function categoryLabel(db, categoryKeyForTexts, fallback) {
    var textsKey = 'menu_category_' + String(categoryKeyForTexts).toLowerCase();
    var fromTexts = (db && typeof db.texts === 'function') ? db.texts(textsKey) : '';
    return fromTexts || fallback;
  }

  var catItems = null;
  var dishGroups = [];
  var selectedConds = { dish: '', area: '', station: '', scene: '', feature: '' };
  var lastDb = null;

  TS.render.chrome('cafe');

  // 追加条件はURLクエリでも着地可(dish/area/station/scene/feature)。typeはCafe固定のため常に無視して上書きする。
  var urlConds = TS.search.condsFromUrl();
  selectedConds.dish = urlConds.dish || '';
  selectedConds.area = urlConds.area || '';
  selectedConds.station = urlConds.station || '';
  selectedConds.scene = urlConds.scene || '';
  selectedConds.feature = urlConds.feature || '';

  TS.data.load().then(function (db) {
    lastDb = db;
    TS.render.footerNotices(db);
    insertWarningsBanner(db);
    applyTexts(db);

    catItems = buildCatItems(db);
    dishGroups = buildDishGroups(db, db.menus.filter(function (m) { return m.published; }));

    renderCatGroup('area', 'chips-area');
    renderCatGroup('station', 'chips-station');
    renderCatGroup('scene', 'chips-scene');
    renderCatGroup('feature', 'chips-feature');
    renderDishGroups();

    // 初回着地もCafeという条件の検索利用として1回分数える(要件4章の集計例に「Cafe 20回」が明記されているため。
    // 重複はlog.js側のsessionStorage直前条件比較で1回化される)。「条件をクリア」はログ対象外
    // (実装設計書13-I-1・UI再描画のみ)なので、runCafeSearchへ明示的にログあり(true)で渡す。
    runCafeSearch(true);

  }).catch(function (err) {
    var errEl = document.getElementById('cafe-error');
    errEl.hidden = false;
    TS.data.loadError(errEl, err);
  });

  // シート設定に問題がある可能性がある時だけ警告バナーを先頭に挿入する(実装設計書13-I-10)。
  // TS.render.warningsBannerは担当Hが並行実装中の関数のため、typeofガードを必須にして独立動作させる
  // (未実装の間は何もしない=本ページの他機能に影響しない)。
  function insertWarningsBanner(db) {
    if (typeof TS.render.warningsBanner !== 'function') return;
    var banner = TS.render.warningsBanner(db);
    if (!banner) return;
    var mount = document.getElementById('warnings-banner-mount');
    if (mount) mount.appendChild(banner);
  }

  // ---- Site_Texts駆動の文言(要件2-2)。texts-default.jsの現行値=仕様書3-5/3-2/3-3の文言そのもの ----

  function setTextIfPresent(id, text) { if (text) TS.util.setText(id, text); }

  function applyTexts(db) {
    setTextIfPresent('cafe-title', db.texts('cafe_heading'));
    setTextIfPresent('cafe-catch', db.texts('cafe_catch'));
    setTextIfPresent('cafe-lead', db.texts('cafe_lead'));
    setTextIfPresent('cat-title-dish', db.texts('search_cat_dish'));
    setTextIfPresent('cat-title-area', db.texts('search_cat_area'));
    setTextIfPresent('cat-title-station', db.texts('search_cat_station'));
    setTextIfPresent('cat-title-scene', db.texts('search_cat_scene'));
    setTextIfPresent('cat-title-feature', db.texts('search_cat_feature'));
    setTextIfPresent('cafe-submit-btn', db.texts('search_button'));
    setTextIfPresent('cafe-clear-btn', db.texts('search_clear'));
    setTextIfPresent('cafe-results-change-btn', db.texts('search_change'));
  }

  // ---- 選択肢の動的生成(search.htmlと同一ロジック。共有jsファイルが設計書1章の構成に無いため複製) ----

  function dedupOrdered(values) {
    var seen = {};
    var out = [];
    (values || []).forEach(function (v) {
      var t = (v == null ? '' : String(v)).trim();
      if (!t) return;
      var key = TS.util.norm(t);
      if (seen[key]) return;
      seen[key] = true;
      out.push(t);
    });
    return out;
  }

  function buildCatItems(db) {
    var stores = db.stores.filter(function (s) { return s.published; });
    var scenes = db.scenes.filter(function (s) { return s.published; });
    var features = db.features.filter(function (s) { return s.published; });
    return {
      area: dedupOrdered(stores.map(function (s) { return s.area; })),
      station: dedupOrdered(stores.map(function (s) { return s.station; })),
      scene: dedupOrdered(scenes.map(function (s) { return s.name; })),
      feature: dedupOrdered(features.map(function (s) { return s.name; }))
    };
  }

  // 実装設計書13-I-6: カテゴリ突合はnormSearch相当(小文字化込み)にして大文字小文字ゆれを吸収する。
  function buildDishGroups(db, publishedMenus) {
    var groups = [];
    var knownNorm = {};
    MENU_CATEGORY_ORDER.forEach(function (key) { knownNorm[TS.util.normSearch(key)] = true; });

    MENU_CATEGORY_ORDER.forEach(function (key) {
      var names = publishedMenus
        .filter(function (m) { return TS.util.normSearch(m.category) === TS.util.normSearch(key); })
        .map(function (m) { return m.name; });
      var items = dedupOrdered(names);
      if (items.length) groups.push({ key: key, label: categoryLabel(db, key, MENU_CATEGORY_LABELS[key] || key), items: items });
    });

    var others = publishedMenus
      .filter(function (m) { return !knownNorm[TS.util.normSearch(m.category)]; })
      .map(function (m) { return m.name; });
    var otherItems = dedupOrdered(others);
    if (otherItems.length) groups.push({ key: '_OTHER', label: categoryLabel(db, 'other', 'その他'), items: otherItems });

    return groups;
  }

  function toggleCond(cat, value) {
    if (selectedConds[cat] && TS.util.norm(selectedConds[cat]) === TS.util.norm(value)) {
      selectedConds[cat] = '';
    } else {
      selectedConds[cat] = value;
    }
  }

  function renderCatGroup(cat, mountId) {
    var mount = document.getElementById(mountId);
    if (!mount || !catItems) return;
    while (mount.firstChild) mount.removeChild(mount.firstChild);
    var chipsEl = TS.render.chips(catItems[cat], {
      selectedValue: selectedConds[cat] || null,
      onSelect: function (value) {
        toggleCond(cat, value);
        renderCatGroup(cat, mountId);
      }
    });
    mount.appendChild(chipsEl);
  }

  function renderDishGroups() {
    var mount = document.getElementById('dish-groups');
    if (!mount) return;
    while (mount.firstChild) mount.removeChild(mount.firstChild);
    dishGroups.forEach(function (grp) {
      var wrap = TS.util.el('div', { class: 'dish-subgroup' });
      wrap.appendChild(TS.util.el('p', { class: 'dish-subgroup__title' }, [grp.label]));
      var chipsEl = TS.render.chips(grp.items, {
        selectedValue: selectedConds.dish || null,
        onSelect: function (value) {
          toggleCond('dish', value);
          renderDishGroups();
        }
      });
      wrap.appendChild(chipsEl);
      mount.appendChild(wrap);
    });
  }

  // ---- 検索実行・結果描画 ----

  // type は常にCafe固定(要件1章5番)。selectedCondsには持たせず、ここで毎回上書きすることで
  // 「条件をクリア」を押しても外れないことを構造的に保証する。
  function currentConds() {
    return {
      dish: selectedConds.dish, area: selectedConds.area, station: selectedConds.station,
      scene: selectedConds.scene, feature: selectedConds.feature, type: 'Cafe', freeword: ''
    };
  }

  // 実装設計書13-I-2: 0件時に「全店舗を表示しています」と言うと矛盾するため、件数に応じて出し分ける。
  function buildDroppedMessage(dropped, db, count) {
    if (!dropped || !dropped.length) return '';
    var quoted = dropped.map(function (d) { return '「' + d.val + '」'; }).join('');
    if (count === 0) {
      var zeroSuffix = (db && db.texts('search_dropped_zero_note')) || DROPPED_SUFFIX_ZERO_FALLBACK;
      return quoted + zeroSuffix;
    }
    var suffix = (db && db.texts('search_dropped_note')) || DROPPED_SUFFIX_FALLBACK;
    return quoted + suffix;
  }

  function renderResults(db, conds, result) {
    var stores = result.stores, dropped = result.dropped;

    TS.util.setText('cafe-results-heading', TS.search.label(conds, stores.length));

    var droppedEl = document.getElementById('cafe-dropped-note');
    var msg = buildDroppedMessage(dropped, db, stores.length);
    if (msg) {
      droppedEl.textContent = msg;
      droppedEl.hidden = false;
    } else {
      droppedEl.hidden = true;
      droppedEl.textContent = '';
    }

    var listEl = document.getElementById('cafe-results-list');
    while (listEl.firstChild) listEl.removeChild(listEl.firstChild);
    var emptyEl = document.getElementById('cafe-results-empty');

    if (!stores.length) {
      listEl.hidden = true;
      emptyEl.hidden = false;
      TS.util.setText('cafe-results-empty-text', (db && db.texts('search_zero')) || ZERO_FALLBACK);
    } else {
      listEl.hidden = false;
      emptyEl.hidden = true;
      stores.forEach(function (s) { listEl.appendChild(TS.render.storeCard(s, db)); });
    }
  }

  function updateUrl(conds) {
    try {
      var params = new URLSearchParams();
      ['dish', 'area', 'station', 'scene', 'feature'].forEach(function (k) {
        if (conds[k]) params.set(k, conds[k]);
      });
      var qs = params.toString();
      history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    } catch (e) { /* History API非対応でも検索自体は継続させる */ }
  }

  // withLog=true の呼び出しだけログ計測対象(実装設計書13-I-1裁定): 初回着地+[この条件で探す]押下。
  // 「条件をクリア」はUI再描画のみでログ計測対象外(search.htmlの[条件をクリア]と対称に統一)。
  function runCafeSearch(withLog) {
    if (!lastDb) return;
    var conds = currentConds();
    var result = TS.search.run(lastDb, conds);
    renderResults(lastDb, conds, result);
    updateUrl(conds);
    if (withLog) {
      // 要件4章: Cafeという条件の検索利用回数を数えるため、初回着地+[この条件で探す]押下時に呼ぶ
      // (連続同一条件はlog.js側のsessionStorage比較で1回化される)。
      TS.log.search(conds, '');
    }
  }

  document.getElementById('cafe-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    runCafeSearch(true);
  });

  document.getElementById('cafe-clear-btn').addEventListener('click', function () {
    selectedConds = { dish: '', area: '', station: '', scene: '', feature: '' };
    if (catItems) {
      renderCatGroup('area', 'chips-area');
      renderCatGroup('station', 'chips-station');
      renderCatGroup('scene', 'chips-scene');
      renderCatGroup('feature', 'chips-feature');
      renderDishGroups();
    }
    // 実装設計書13-I-1: クリアはUI再描画のみ(ログ発火しない)。search.htmlの[条件をクリア]と対称。
    if (lastDb) runCafeSearch(false);
  });

  document.getElementById('cafe-results-change-btn').addEventListener('click', function () {
    var sec = document.getElementById('cafe-form-section');
    if (sec && sec.scrollIntoView) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
})();
</script>
</body>
</html>
