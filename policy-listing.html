<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow"> <!-- 検収後の移管時にこの行を削除 -->
<title id="page-title">掲載情報について｜THAI SPOT TOKYO</title>
<meta name="description" id="page-description" content="掲載情報の確認方法や、修正のご依頼方法について説明しています。">
<link rel="stylesheet" href="assets/css/style.css?v=20260826a">
</head>
<body>

<div id="site-header"></div>

<main id="main-content">
  <div class="container">
    <!-- シート設定に問題がある可能性があるときだけ表示(実装設計書13-H-12。search.html等と同一の慣例) -->
    <div id="warnings-banner-mount"></div>

    <div class="article">
      <h1 class="article__title" id="article-title">掲載情報について</h1>
      <p class="article__body" id="article-body"></p>
      <p id="article-cta"></p>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<!-- 要件2-2「文言層は無停止」: 本文はSite_Texts駆動だが、通信失敗時でもtexts-default.jsの組み込み文言で
     ページとして完全に成立させる(白画面・空欄禁止)。広告枠なし(要件1章8番)。
     動的テキストは全てTS.util.setText()(textContent代入)経由。 -->
<script src="assets/js/config.js?v=20260826a"></script>
<script src="assets/js/texts-default.js?v=20260826a"></script>
<script src="assets/js/util.js?v=20260826a"></script>
<script src="assets/js/data.js?v=20260826a"></script>
<script src="assets/js/render.js?v=20260826a"></script>
<script>
(function () {
  'use strict';

  var U = TS.util;

  TS.render.chrome('policy-listing');

  function applyTexts(texts) {
    document.title = texts('meta_title_policy_listing') || document.title;
    var descMeta = document.getElementById('page-description');
    if (descMeta) descMeta.setAttribute('content', texts('meta_desc_policy_listing'));

    U.setText('article-title', texts('policy_listing_title'));
    U.setText('article-body', texts('policy_listing_body'));

    renderCta(texts('policy_listing_cta_label'));
  }

  // CTAボタン: 「掲載情報の修正を連絡する」→ contact.html（店舗名の事前入力なし・仕様書3-8の導線）
  function renderCta(label) {
    var mount = document.getElementById('article-cta');
    mount.textContent = '';
    if (!label) return;
    var a = U.el('a', { class: 'btn btn--primary' }, [label]);
    a.href = 'contact.html'; // 自前組み立て文字列は直接代入(設計書10-1)
    mount.appendChild(a);
  }

  applyTexts(function (key) { return (TS.textsDefault && TS.textsDefault[key]) || ''; });

  TS.data.load().then(function (db) {
    TS.render.footerNotices(db);
    insertWarningsBanner(db);
    applyTexts(db.texts);
  }).catch(function (err) {
    if (typeof console !== 'undefined') console.error('[policy-listing.html] データ取得に失敗(texts-defaultで続行):', err);
  });

  // シート設定に問題がある可能性があるときだけ小バナーを先頭に挿入(実装設計書13-H-12)
  function insertWarningsBanner(db) {
    if (typeof TS.render.warningsBanner !== 'function') return;
    var banner = TS.render.warningsBanner(db);
    if (!banner) return;
    var mount = document.getElementById('warnings-banner-mount');
    if (mount) mount.appendChild(banner);
  }
})();
</script>
</body>
</html>
